# Redirect all plain HTTP to HTTPS so no interaction is ever served unencrypted
# (assignment requirement: all traffic over SSL/TLS).
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    # Self-signed cert generated at image build time (see docker/Dockerfile.frontend).
    # Swap these paths for a real CA-signed cert + key to go to production.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip compression
    # compresses text responses, cutting download size by roughly 60-80%.
    # Angular bundles (JS/CSS) and API JSON all benefit.
    gzip              on;
    gzip_vary         on;           # Vary: Accept-Encoding header for CDN/proxy caches
    gzip_comp_level   6;            # Level 6 is the sweet spot: good ratio, low CPU cost
    gzip_min_length   256;          # Don't compress tiny responses (overhead > gain)
    gzip_proxied      any;          # Compress even when serving through a reverse proxy
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # Angular HTML5 routing
    # Angular uses the History API (/events/123, not /#/events/123). Without this,
    # refreshing a non-root URL would 404 because nginx looks for a real file there.
    # try_files checks the path, then the directory, then falls back to index.html
    # so the Angular router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    # forward all /api/ calls to the backend container. "backend" resolves via
    # Docker's internal DNS (the service name in docker-compose.yml), so the Angular
    # app always calls its own origin (/api/v1/...) and nginx routes it, no CORS needed.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # static asset caching
    # Angular bundles carry content hashes in their filenames, so caching them
    # long-term is safe.
    location ~* \.(js|css|png|jpg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }
}
